const OUT = [34, 26, 40];

    width = width || 1;

    for (let y = Math.floor(minY); y <= maxY; y++)

const SKIN = [[242, 200, 160], [226, 176, 134], [196, 140, 100]];

// --------------------------------------------------------------------------- people
function person(direction, frame, o) {
  const W = 18, H = 26, s = new PS(W, H), X = 1, HY = 6, BY = 14, LY = 20;
  const skin = o.skin || SKIN[0], hair = o.hair || [110, 70, 40], shirt = o.shirt || [70, 120, 190];
  const pants = o.pants || [80, 70, 60], boots = o.boots || [70, 45, 30], dress = !!o.dress;
  const side = direction === "right";
  const R = (x, y, w, h, c) => s.rect(x, y, w, h, c), P = (x, y, c) => s.set(x, y, c);
  // legs
  if (!dress) {
    if (!side) {
      const lu = frame === 1 ? 1 : 0, ru = frame === 2 ? 1 : 0;
      R(X + 5, LY, 3, 4 - lu, pants); R(X + 5, LY + 4 - lu, 3, 1, boots);
      R(X + 9, LY, 3, 4 - ru, pants); R(X + 9, LY + 4 - ru, 3, 1, boots);
    } else if (frame === 0) {
      R(X + 6, LY, 4, 4, pants); R(X + 6, LY + 4, 5, 1, boots);
    } else {
      const f = frame === 1 ? 1 : -1;
      R(X + 7 + f * 2, LY, 3, 4, pants); R(X + 7 + f * 2, LY + 4, 4, 1, boots);
      R(X + 7 - f * 2, LY, 3, 3, shade(pants, 0.8)); R(X + 7 - f * 2, LY + 3, 4, 1, shade(boots, 0.8));
    }

    const dc = o.dress_color || shirt;
    if (!side) {
      s.polygon([[X + 4, BY], [X + 13, BY], [X + 14, LY + 3], [X + 3, LY + 3]], dc);
      const off = [0, 1, -1][frame];
      R(X + 5 + off, LY + 4, 3, 1, boots); R(X + 10 - off, LY + 4, 3, 1, boots);
    } else {
      s.polygon([[X + 5, BY], [X + 11, BY], [X + 13, LY + 3], [X + 4, LY + 3]], dc);
      const off = [0, 2, -2][frame];
      R(X + 7 + off, LY + 4, 4, 1, boots);
    }
  }
  // torso and arms
  if (!side) {
    R(X + 4, BY, 10, 6, shirt);
    R(X + 4, BY + 5, 10, 1, !dress ? shade(pants, 0.9) : shade(shirt, 0.8));
    const sw = [0, 1, -1][frame];
    R(X + 2, BY + Math.max(0, sw), 2, 4, shade(shirt, 0.85)); R(X + 2, BY + 4 + Math.max(0, sw), 2, 1, skin);
    R(X + 14, BY + Math.max(0, -sw), 2, 4, shade(shirt, 0.85)); R(X + 14, BY + 4 + Math.max(0, -sw), 2, 1, skin);
    if (o.apron) R(X + 6, BY + 1, 6, 7, [236, 232, 220]);
    if (o.scarf) R(X + 5, BY, 8, 2, o.scarf);
  } else {
    R(X + 5, BY, 7, 6, shirt);
    R(X + 5, BY + 5, 7, 1, !dress ? shade(pants, 0.9) : shade(shirt, 0.8));
    const sw = [0, 2, -2][frame];
    R(X + 7 + Math.floor(sw / 2), BY + 1, 3, 4, shade(shirt, 0.82)); R(X + 7 + sw, BY + 5, 3, 1, skin);
    if (o.apron) R(X + 10, BY + 1, 2, 7, [236, 232, 220]);
    if (o.scarf) R(X + 6, BY, 6, 2, o.scarf);
  }
  // head
  const style = o.hair_style || "short", eye = o.eye || [40, 30, 40];
  if (direction === "down") {
    R(X + 4, HY, 10, 8, skin);
    if (style !== "bald") {
      R(X + 4, HY, 10, 3, hair); R(X + 4, HY + 3, 1, 2, hair); R(X + 13, HY + 3, 1, 2, hair);
      if (style === "long") { R(X + 3, HY + 1, 2, 10, hair); R(X + 13, HY + 1, 2, 10, hair); }
      if (style === "bun") R(X + 7, HY - 2, 4, 2, hair);
    }

    P(X + 5, HY + 5, [232, 140, 130]); P(X + 12, HY + 5, [232, 140, 130]);
    R(X + 8, HY + 6, 2, 1, shade(skin, 0.75));
    if (o.beard) { R(X + 5, HY + 5, 8, 4, o.beard); R(X + 6, HY + 9, 6, 2, o.beard); R(X + 8, HY + 6, 2, 1, shade(o.beard, 0.7)); }
    if (o.glasses) {

      P(X + 6, HY + 4, [200, 230, 250]); P(X + 11, HY + 4, [200, 230, 250]);
    }
  } else if (direction === "up") {
    R(X + 4, HY, 10, 8, skin);
    if (style !== "bald") {
      R(X + 4, HY, 10, 7, hair);
      if (style === "long") R(X + 3, HY + 1, 12, 10, hair);
      if (style === "bun") R(X + 7, HY - 2, 4, 3, hair);
    }
    if (o.beard) { R(X + 4, HY + 6, 1, 2, o.beard); R(X + 13, HY + 6, 1, 2, o.beard); }
  } else {
    R(X + 5, HY, 9, 8, skin); P(X + 14, HY + 4, skin);
    if (style !== "bald") {
      R(X + 5, HY, 9, 3, hair); R(X + 5, HY + 3, 4, 3, hair);
      if (style === "long") R(X + 4, HY + 1, 4, 10, hair);
      if (style === "bun") R(X + 4, HY - 1, 3, 3, hair);
    }
    P(X + 11, HY + 4, eye);
    R(X + 11, HY + 6, 2, 1, shade(skin, 0.75)); P(X + 10, HY + 5, [232, 140, 130]);
    if (o.beard) { R(X + 9, HY + 5, 5, 4, o.beard); R(X + 9, HY + 9, 4, 2, o.beard); }
    if (o.glasses) { R(X + 10, HY + 3, 3, 3, [60, 60, 70]); P(X + 11, HY + 4, [200, 230, 250]); }
  }

  const hat = o.hat;
  if (hat === "kerchief") {
    const c = o.hat_color || [200, 60, 60];
    if (direction === "right") { R(X + 4, HY - 1, 10, 4, c); R(X + 4, HY + 3, 4, 3, c); }
    else {
      R(X + 3, HY - 1, 12, 4, c);
      if (direction === "up") { R(X + 4, HY + 3, 10, 4, c); s.polygon([[X + 7, HY + 7], [X + 11, HY + 7], [X + 9, HY + 10]], c); }
    }
    for (const [dx, dy] of [[5, 0], [9, 1], [12, 0], [7, 2]]) P(X + dx, HY - 1 + dy, [250, 240, 230]);
  } else if (hat === "wizard") {
    const c = o.hat_color || [80, 70, 160];
    R(X + 2, HY + 1, 14, 2, c);
    s.polygon([[X + 4, HY + 1], [X + 13, HY + 1], [X + 11, HY - 4], [X + 9, HY - 6], [X + 7, HY - 3]], c);
    P(X + 9, HY - 1, [250, 220, 90]); P(X + 8, HY - 2, [250, 220, 90]);

    const c = [226, 192, 100];

  }

}

  } else if (kind === "plaza") {

    for (let y = 17; y < 38; y++) for (let x = 0; x < MW; x++) if (!near.has(World.k(x, y))) this.foot.add(World.k(x, y));
    for (let i = 0; i < 30; i++) {
      const x = r.randint(10, 40), y = r.randint(17, 37);
      if (near.has(World.k(x, y)) && this.tiles[y][x] === "f") this.add(new Prop("ffl" + i, "flower", x, y, { solid: false, layer: -1 }));
    }
    [28, 29, 34, 35].forEach((x, i) => this.add(new Prop("stone" + i, "stone_word", x, 17, { solid: false, layer: -1 })));
    this.add(new Prop("tower", "tower", 31, 5, { w: 2, foot: block(29, 6, [2, 3, 4, 5]) }));
    for (const [x, y] of [[24, 7], [40, 7], [27, 3], [37, 3], [22, 9], [42, 9]]) this.add(new Prop("cr" + x, ["crystal0", "crystal1"], x, y, { solid: false }));
    const xs = []; for (let x = 0; x < 20; x += 2) xs.push(x); for (let x = 46; x < MW; x += 2) xs.push(x);
    for (const x of xs) for (const y of [1, 4, 7]) this.add(new Prop(`tp${x}_${y}`, "pine" + ((x + y) % 4), x + (y % 2), y));
    for (let x = 0; x < MW; x++) this.foot.add(World.k(x, 0));
  }
  tileAt(tx, ty) { return (tx >= 0 && tx < MW && ty >= 0 && ty < MH) ? this.tiles[ty][tx] : "r"; }
  zoneAt(x, y) { return zoneOfRow(Math.floor(y / TILE)); }
  solidTile(tx, ty, small) {
    if (tx < 0 || tx >= MW || ty < 0 || ty >= MH) return true;
    if (SOLID_TILES.includes(this.tiles[ty][tx])) return true;
    const k = World.k(tx, ty);
    if (this.foot.has(k)) return true;
    if (this.special[k] === "hole" && !small) return true;

  }
  blockedRect(r, small, ignore, ents) {

    if (ents !== false) for (const e of this.entities) {
      if (e === ignore || !e.visible || !e.solid) continue;

    }
    return false;
  }
}

// ============================================================================
// actions: everything a story script can `yield`. Events reaching actions:
//   {type:"key", key:"left|right|up|down|space|enter|e|shift|back|1..9|..."}
//   {type:"tap", x, y}   {type:"move", x, y}    (logical 960x640 coordinates)
// ============================================================================
function isConfirm(ev) { return (ev.type === "key" && (ev.key === "e" || ev.key === "space" || ev.key === "enter")) || ev.type === "tap"; }

class Action {
  constructor() { this.done = false; this.result = null; this.t = 0; this.dimA = 0; }
  start(g) { this.g = g; this.t = 0; }
  handle(ev) { }
  update(dt) { this.t += dt; if (this.g.auto && this.t > 0.02) this.autoplay(); }
  autoplay() { this.done = true; }
  draw(ctx) { }
}

function boxR() { return [20, HEIGHT - 176, WIDTH - 40, 158]; }

function portraitOf(g, speaker) {
  const colored = g.isColored(speaker), sprite = g.speakerSprite(speaker), key = speaker + "|" + sprite + "|" + colored;
  if (g.portraitCache[key] !== undefined) return g.portraitCache[key];
  let img = null;
  const a = g.art;
  if (a.people[sprite]) {
    const fr = (colored ? a.people : a.peopleGrey)[sprite].down[0];
    img = makeCanvas(84, 84);
    const c = img.getContext("2d"); c.imageSmoothingEnabled = false;
    c.drawImage(fr, 42 - fr.width, 4, fr.width * 2, fr.height * 2);
  } else if (a.animals[sprite]) {
    const fr = (colored ? a.animals : a.animalsGrey)[sprite].right[0];
    const k = Math.min(76 / fr.width, 76 / fr.height);
    img = makeCanvas(84, 84);
    const c = img.getContext("2d"); c.imageSmoothingEnabled = false;
    c.drawImage(fr, 42 - fr.width * k / 2, 42 - fr.height * k / 2, fr.width * k, fr.height * k);
  }
  g.portraitCache[key] = img;
  return img;
}

function drawImg(ctx, img, x, y, k) {
  ctx.imageSmoothingEnabled = false;
  if (!k || k === 1) ctx.drawImage(img, Math.round(x), Math.round(y));
  else ctx.drawImage(img, Math.round(x), Math.round(y), Math.round(img.width * k), Math.round(img.height * k));
}

function tapHint(g) { return g.touch ? "нажми, чтобы продолжить" : "E — дальше"; }

// ---------------------------------------------------------------------------- dialogue
class Say extends Action {
  constructor(speaker, text, speak) { super(); this.speaker = speaker; this.text = text; this.speak = speak !== false; this.shown = 0; }
  start(g) {
    super.start(g);
    this.total = textLength(this.text, g.known, g.name);
    const de = germanParts(this.text, g.name);
    if (de && this.speak) { g.audio.say(de); g.lastGerman = de; }
    this.lastBlip = 0;
  }
  handle(ev) { if (isConfirm(ev)) { if (this.shown < this.total) this.shown = this.total; else this.done = true; } }
  update(dt) {
    super.update(dt);
    if (this.shown < this.total) {
      this.shown += dt * (this.speaker ? 70 : 55);
      const b = Math.floor(this.shown / 3);
      if (b !== this.lastBlip) { this.lastBlip = b; if (this.speaker && this.speaker !== "think") this.g.audio.play("blip", 0.4); }
    }
  }
  draw(ctx) { drawSayBox(ctx, this.g, this.speaker, this.text, this.shown, this.shown >= this.total, this.t); }
}

function drawSayBox(ctx, g, speaker, text, shown, finished, t) {
  const BOX = boxR();
  const narr = speaker === null || speaker === undefined, think = speaker === "think";
  panel(ctx, BOX, { color: narr ? [22, 18, 34] : PANEL, border: (narr || think) ? MUTED : GOLD });
  let x = BOX[0] + 22;
  if (!narr && !think) {
    const img = portraitOf(g, speaker);
    if (img) {
      const pr = [BOX[0] + 14, BOX[1] + 14, 92, 92];
      roundRect(ctx, pr[0], pr[1], pr[2], pr[3], 8); ctx.fillStyle = rgb(PANEL2); ctx.fill();
      ctx.drawImage(img, pr[0] + 4, pr[1] + 4);
      x = pr[0] + pr[2] + 18;
    }
    const name = g.speakerName(speaker), nw = measure(ctx, name, 28, true);
    panel(ctx, [x - 12, BOX[1] - 20, nw + 24, 34], { color: PANEL, border: GOLD, alpha: 255, radius: 8, width: 2 });
    drawText(ctx, name, x, BOX[1] - 12, 28, GOLD, { bold: true });
  }
  const rect = [x, BOX[1] + 22, BOX[0] + BOX[2] - x - 24, BOX[3] - 30];
  drawMixed(ctx, think ? "(" + text + ")" : text, g.known, rect, 29, Math.floor(shown), g.name);
  if (finished && Math.floor(t * 3) % 2 === 0) {
    const bx = BOX[0] + BOX[2], by = BOX[1] + BOX[3];
    ctx.fillStyle = rgb(GOLD); ctx.beginPath(); ctx.moveTo(bx - 30, by - 24); ctx.lineTo(bx - 18, by - 24); ctx.lineTo(bx - 24, by - 16); ctx.fill();
  }
}

class Choice extends Action {
  constructor(speaker, prompt, options, correct, image) {
    super(); this.speaker = speaker; this.prompt = prompt; this.options = options;
    this.correct = correct === undefined ? 0 : correct; this.image = image || null; this.sel = 0; this.rects = [];
  }
  start(g) {
    super.start(g);
    const de = germanParts(this.prompt, g.name);
    if (de) { g.audio.say(de); g.lastGerman = de; }
  }
  autoplay() { this.pick(this.correct === null ? 0 : this.correct); }
  pick(i) {
    this.result = i; this.done = true;
    const de = germanParts(this.options[i], this.g.name);
    if (de) { this.g.audio.say(de); this.g.lastGerman = de; }
    this.g.audio.play("blip");
  }
  handle(ev) {
    const n = this.options.length;

    else if (ev.type === "tap") { this.rects.forEach((r, i) => { if (inRect(r, ev.x, ev.y)) this.pick(i); }); }
  }
  draw(ctx) {
    const g = this.g;
    if (this.image) {
      const w = this.image.width, h = this.image.height, x = WIDTH / 2 - w / 2, y = 200 - h / 2;
      panel(ctx, [x - 20, y - 20, w + 40, h + 40], { alpha: 250 });
      drawImg(ctx, this.image, x, y);
    }
    drawSayBox(ctx, g, this.speaker, this.prompt, 1e6, false, this.t);
    const BOX = boxR();
    const n = this.options.length, bw = g.touch ? 380 : 330, bh = g.touch ? 52 : 44, gap = bh + 8;
    this.rects = [];
    const y0 = BOX[1] - 20 - n * gap;
    this.options.forEach((o, i) => {
      const r = [WIDTH - bw - 34, y0 + i * gap, bw, bh];
      this.rects.push(r);
      const sel = i === this.sel && !g.touch;
      panel(ctx, r, { color: sel ? PANEL2 : PANEL, border: sel ? GOLD : MUTED, alpha: 245, width: sel ? 3 : 2 });
      drawText(ctx, String(i + 1), r[0] + 14, r[1] + bh / 2 - 9, 24, sel ? GOLD : MUTED);
      drawMixed(ctx, o, g.known, [r[0] + 40, r[1] + bh / 2 - 11, r[2] - 50, 30], 30, null, g.name);
      if (sel) { ctx.fillStyle = rgb(GOLD); ctx.beginPath(); const cy = r[1] + bh / 2; ctx.moveTo(r[0] - 16, cy - 7); ctx.lineTo(r[0] - 6, cy); ctx.lineTo(r[0] - 16, cy + 7); ctx.fill(); }
    });
  }
}

// ---------------------------------------------------------------------------- the birth of a word
function drawHat(ctx, cx, bottom, color, k) {
  k = k || 1;
  const w = 46 * k;
  ctx.fillStyle = rgb(color);
  ctx.beginPath(); ctx.ellipse(cx, bottom - 3 * k, w / 2, 5 * k, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - w / 3, bottom - 4 * k); ctx.lineTo(cx + w / 3, bottom - 4 * k); ctx.lineTo(cx + 4, bottom - 30 * k); ctx.lineTo(cx - 6, bottom - 26 * k); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgb(light(color, 0.4));
  ctx.beginPath(); ctx.ellipse(cx, bottom - 7 * k, w / 3, 3 * k, 0, 0, TAU); ctx.fill();
}

class Spark extends Action {
  constructor(key, feel, effect, image, fast) {
    super(); this.key = key; this.feel = feel || WORDS[key].feel; this.effect = effect || null; this.image = image || null;

  }
  start(g) {

    const totalW = measure(ctx, this.de, 92, true);
    const aw = this.art ? measure(ctx, this.art, 60, true) + 26 : 0;
    let x = WIDTH / 2 - (totalW + aw) / 2 + aw;
    this.artX = x - aw / 2 - 8;
    let i = 0;
    for (const ch of this.de) {
      const w = measure(ctx, ch, 92, true), ang = Math.random() * TAU;
      this.letters.push({ ch, x, sx: WIDTH / 2 + Math.cos(ang) * 520, sy: 330 + Math.sin(ang) * 380, t: -i * (this.fast ? 0.06 : 0.11) });
      x += w; i++;
    }
    const sfx = { warm: "crackle", cold: "brr", small: "shrink", big: "grow", dark: "whoosh", light: "chime", dog: "woof", cat: "meow", sheep: "baa", owl: "owl", bear: "growl", water: "splash", door: "door", jump: "jump" }[this.effect];
    if (sfx) g.audio.play(sfx);

  }
  autoplay() { if (!this.done) { this.g.learn(this.key, true); this.done = true; } }
  handle(ev) {

    else if (this.phase === "form") { for (const L of this.letters) L.t = Math.max(L.t, 1); this.phase = "say"; this.pt = 0; }
    else if (this.phase === "say") this.speak();

  }
  speak() {
    const g = this.g;
    g.audio.say(withArticle(this.key)); g.lastGerman = withArticle(this.key);
    g.audio.play("word"); g.learn(this.key, true);
    this.phase = "done"; this.pt = 0;
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * TAU, sp = uniform(80, 420);
      this.burst.push([WIDTH / 2, 330, Math.cos(a) * sp, Math.sin(a) * sp, uniform(0.6, 1.3), choice([this.col, GOLD, WHITE])]);
    }
  }
  update(dt) {
    super.update(dt);

      ctx.fillStyle = "rgb(255,190,80)";
      for (let i = 0; i < 14; i++) { const x = (i * 137 + t * 40) % WIDTH, y = HEIGHT - ((t * 120 + i * 53) % HEIGHT); ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill(); }
    } else if (e === "cold") {

      ctx.fillStyle = "rgb(240,250,255)";
      for (let i = 0; i < 40; i++) { const x = ((i * 97 + Math.sin(t + i) * 30) % WIDTH + WIDTH) % WIDTH, y = (t * 60 + i * 41) % HEIGHT; ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill(); }
    } else if (e === "dark") { ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, WIDTH, HEIGHT); }

    this.drawEffect(ctx);

    if (this.effect === "small" && this.phase !== "done") k *= 0.8 + 0.2 * Math.cos(this.t * 2);

    if (this.phase === "done") { ctx.fillStyle = rgb(this.col, 60 / 255); ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 + 40, h / 2 + 40, 0, 0, TAU); ctx.fill(); }

    const baseY = 360;
    ctx.font = fontCss(92, true); ctx.textBaseline = "top"; ctx.textAlign = "left";

      const x = L.sx + (L.x - L.sx) * e, y = L.sy + (baseY - L.sy) * e;
      const col = this.phase === "done" ? this.col : light(this.col, 0.5 * (1 - tt) + 0.2);
      ctx.fillStyle = "rgb(10,6,16)"; ctx.fillText(L.ch, x + 4, y + 4);
      ctx.fillStyle = rgb(col); ctx.fillText(L.ch, x, y);
      if (tt < 1) { ctx.fillStyle = rgb(GOLD); ctx.beginPath(); ctx.arc(x + 12, y + 30, 3, 0, TAU); ctx.fill(); }
    }
    if (this.art && (this.phase === "say" || this.phase === "done")) {
      const hc = hatColor(this.art);
      drawHat(ctx, this.artX, baseY + 26, hc, 1.15);
      drawText(ctx, this.art, this.artX, baseY + 52, 60, light(hc, 0.3), { center: true, bold: true });
    }
    for (const p of this.burst) { ctx.fillStyle = rgb(p[5]); ctx.fillRect(p[0] - 2, p[1] - 2, 5, 5); }
    if (this.phase === "feel" && this.shown >= this.total && Math.floor(this.t * 2.5) % 2 === 0) drawText(ctx, tapHint(g), WIDTH / 2, 600, 26, MUTED, { center: true });
    if (this.phase === "say") {
      const pulse = 1 + 0.06 * Math.sin(this.pt * 6), w2 = 420 * pulse, h2 = 54 * pulse;
      panel(ctx, [WIDTH / 2 - w2 / 2, 520 - h2 / 2, w2, h2], { color: PANEL2, border: this.col });
      drawText(ctx, g.touch ? "Нажми и скажи вслух" : "ПРОБЕЛ — скажи вслух", WIDTH / 2, 520, 30, WHITE, { center: true });
    }
    if (this.phase === "done") {
      drawText(ctx, "Новое слово в книге!", WIDTH / 2, 500, 30, GOLD, { center: true });
      if (Math.floor(this.pt * 2.5) % 2 === 0) drawText(ctx, tapHint(g), WIDTH / 2, 600, 26, MUTED, { center: true });
    }
  }
}

// ---------------------------------------------------------------------------- sentence building
function keyOfToken(tok) { return deIndex()[tok.toLowerCase().replace(/[!?.,]/g, "")] || null; }
function tileColor(tok) {
  const l = tok.toLowerCase();
  if (l === "der" || l === "die" || l === "das") return hatColor(l);
  const k = keyOfToken(tok);
  return k ? wordColor(k) : [230, 220, 200];
}
function drawStone(ctx, r, color, text, small, sel, glow) {
  if (glow) { roundRect(ctx, r[0] - 15, r[1] - 15, r[2] + 30, r[3] + 30, 20); ctx.fillStyle = rgb(GOLD, 70 / 255); ctx.fill(); }
  const y = sel ? r[1] - 6 : r[1];
  roundRect(ctx, r[0], y + 5, r[2], r[3], 14); ctx.fillStyle = "rgb(70,64,60)"; ctx.fill();
  roundRect(ctx, r[0], y, r[2], r[3], 14); ctx.fillStyle = "rgb(176,170,160)"; ctx.fill();
  roundRect(ctx, r[0] + 5, y + 5, r[2] - 10, r[3] - 18, 10); ctx.fillStyle = "rgb(205,200,190)"; ctx.fill();
  roundRect(ctx, r[0] + 2, y + 2, r[2] - 4, r[3] - 4, 13); ctx.strokeStyle = rgb(color); ctx.lineWidth = 4; ctx.stroke();
  if (sel) { roundRect(ctx, r[0] - 4, y - 4, r[2] + 8, r[3] + 8, 16); ctx.strokeStyle = rgb(GOLD); ctx.lineWidth = 3; ctx.stroke(); }
  drawText(ctx, text, r[0] + r[2] / 2, y + r[3] / 2, small ? 36 : 40, color.map(v => v * 0.55), { center: true, bold: true, shadow: false });
}

class Sentence extends Action {
  constructor(context, answer, extra, image) {
    super();
    this.context = context; this.answer = answer.slice(); this.tiles = answer.concat(extra || []);
    const r = Rng(context.length);
    for (let i = this.tiles.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [this.tiles[i], this.tiles[j]] = [this.tiles[j], this.tiles[i]]; }
    if (this.tiles.slice(0, this.answer.length).join("|") === this.answer.join("|")) this.tiles.push(this.tiles.shift());
    this.used = this.tiles.map(() => false); this.slots = []; this.sel = 0; this.image = image || null;
    this.shake = 0; this.win = 0; this.rects = []; this.slotRects = [];
  }
  autoplay() { if (!this.done) { this.result = true; this.done = true; } }
  place(i) {
    if (this.used[i] || this.win) return;
    this.used[i] = true; this.slots.push(i); this.g.audio.play("stone");
    if (this.slots.length === this.answer.length) {
      const words = this.slots.map(j => this.tiles[j]);
      if (words.join("|") === this.answer.join("|")) {
        this.win = 0.01; this.g.audio.play("ok");
        const s = words.join(" "); this.g.audio.say(s); this.g.lastGerman = s;
        for (const w of words) { const k = keyOfToken(w); if (k) this.g.use(k); }
      } else { this.shake = 0.5; this.g.audio.play("wrong"); }
    }
  }
  undo() { if (this.slots.length && !this.win) this.used[this.slots.pop()] = false; }
  handle(ev) {
    const n = this.tiles.length;
    if (this.win > 0.6 && isConfirm(ev)) { this.result = true; this.done = true; return; }
    if (ev.type === "key") {
      if (ev.key === "left") this.sel = (this.sel - 1 + n) % n;
      else if (ev.key === "right") this.sel = (this.sel + 1) % n;
      else if (ev.key === "back") this.undo();
      else if (isConfirm(ev)) {
        this.place(this.sel);
        if (!this.win) { const free = []; for (let i = 0; i < n; i++) if (!this.used[i]) free.push(i); if (free.length) this.sel = free.reduce((a, b) => ((a - this.sel + n) % n <= (b - this.sel + n) % n ? a : b)); }
      }
    } else if (ev.type === "tap") {
      if (this.slotRects.some(r => inRect(r, ev.x, ev.y))) { this.undo(); return; }
      this.rects.forEach((r, i) => { if (inRect(r, ev.x, ev.y)) this.place(i); });
    } else if (ev.type === "move") this.rects.forEach((r, i) => { if (inRect(r, ev.x, ev.y)) this.sel = i; });
  }
  update(dt) {
    super.update(dt);

    if (this.shake > 0) { this.shake -= dt; if (this.shake <= 0) { for (const i of this.slots) this.used[i] = false; this.slots = []; } }
    if (this.win) this.win += dt;
  }
  draw(ctx) {
    const g = this.g;
    dim(ctx, this.dimA);
    let top = 40;
    if (this.image) { drawImg(ctx, this.image, WIDTH / 2 - this.image.width / 2, 120 - this.image.height / 2); top = 120 + this.image.height / 2 + 10; }
    panel(ctx, [80, top, WIDTH - 160, 70], { alpha: 220, border: MUTED });
    drawMixed(ctx, this.context, g.known, [100, top + 12, WIDTH - 200, 60], 28, null, g.name);
    const widths = this.answer.map(t => Math.max(110, measure(ctx, t, 40, true) + 34));
    const total = widths.reduce((a, b) => a + b, 0) + 14 * (widths.length - 1);
    let x = WIDTH / 2 - total / 2;
    const ox = this.shake > 0 ? Math.sin(this.shake * 40) * 12 : 0;
    this.slotRects = [];
    widths.forEach((w, k) => {
      const r = [x + ox, 300, w, 64];
      this.slotRects.push(r);
      if (k < this.slots.length) { const tok = this.tiles[this.slots[k]]; drawStone(ctx, r, tileColor(tok), tok, false, false, this.win > 0); }
      else { roundRect(ctx, r[0], r[1], r[2], r[3], 12); ctx.strokeStyle = "rgb(90,80,110)"; ctx.lineWidth = 3; ctx.stroke(); }
      x += w + 14;
    });
    if (this.win) {
      drawText(ctx, "Верно!", WIDTH / 2, 250, 44, GREEN, { center: true, bold: true });
      if (this.win > 0.6 && Math.floor(this.win * 2.5) % 2 === 0) drawText(ctx, tapHint(g), WIDTH / 2, 600, 26, MUTED, { center: true });
    } else if (this.shake > 0) drawText(ctx, "Порядок не тот. Попробуй ещё раз!", WIDTH / 2, 250, 32, RED, { center: true });
    const tw = this.tiles.map(t => Math.max(100, measure(ctx, t, 36, true) + 30));
    const tt = tw.reduce((a, b) => a + b, 0) + 12 * (tw.length - 1);
    x = WIDTH / 2 - tt / 2;
    this.rects = [];
    this.tiles.forEach((t, i) => {
      const r = [x, 450, tw[i], 58];
      this.rects.push(r);
      if (!this.used[i]) drawStone(ctx, r, tileColor(t), t, true, i === this.sel && !this.win && !g.touch);
      else { roundRect(ctx, r[0], r[1], r[2], r[3], 12); ctx.strokeStyle = "rgb(60,52,76)"; ctx.lineWidth = 2; ctx.stroke(); }
      x += tw[i] + 12;
    });
    if (!this.win) drawText(ctx, g.touch ? "Нажимай на камни по порядку. Ошибся? Нажми на фразу, и последний камень вернётся." : "Стрелки — выбрать камень, E — положить, Backspace — убрать последний (можно и мышью)", WIDTH / 2, 560, 22, MUTED, { center: true });
  }
}

// ---------------------------------------------------------------------------- naming a shadow
class ShadowBattle extends Action {
  constructor(animal, key, options, hints) {
    super(); this.animal = animal; this.key = key; this.options = options; this.hints = hints;
    this.removed = new Set(); this.nhints = 1; this.sel = 0; this.phase = "fight"; this.pt = 0; this.shake = 0; this.burst = []; this.rects = [];
  }
  start(g) { super.start(g); g.audio.play("shadow"); }
  autoplay() { if (!this.done) { this.g.learn(this.key, true); this.done = true; } }
  choose(i) {
    if (this.removed.has(i) || this.phase !== "fight") return;
    const k = this.options[i];
    if (k === this.key) {
      this.phase = "named"; this.pt = 0;
      this.g.audio.play("poof"); this.g.audio.say(withArticle(k)); this.g.lastGerman = withArticle(k); this.g.learn(k, true);
      for (let j = 0; j < 90; j++) { const a = Math.random() * TAU, sp = uniform(60, 380); this.burst.push([WIDTH / 2, 230, Math.cos(a) * sp, Math.sin(a) * sp, uniform(0.6, 1.4), choice([[60, 40, 90], GOLD, wordColor(k), WHITE])]); }
    } else {
      this.removed.add(i); this.shake = 0.5; this.g.audio.play("growl");
      this.nhints = Math.min(this.hints.length, this.nhints + 1);
      for (let j = 0; j < this.options.length; j++) if (!this.removed.has(j)) { this.sel = j; break; }
    }
  }
  handle(ev) {
    const n = this.options.length;
    if (this.phase === "named") { if (isConfirm(ev) && this.pt > 0.8) this.done = true; return; }
    if (ev.type === "key") {
      if (ev.key === "up" || ev.key === "left") { do { this.sel = (this.sel - 1 + n) % n; } while (this.removed.has(this.sel)); }
      else if (ev.key === "down" || ev.key === "right") { do { this.sel = (this.sel + 1) % n; } while (this.removed.has(this.sel)); }
      else if (/^[1-9]$/.test(ev.key) && +ev.key - 1 < n) this.choose(+ev.key - 1);
      else if (isConfirm(ev)) this.choose(this.sel);
    } else if (ev.type === "tap") this.rects.forEach((r, i) => { if (inRect(r, ev.x, ev.y)) this.choose(i); });
    else if (ev.type === "move") this.rects.forEach((r, i) => { if (inRect(r, ev.x, ev.y) && !this.removed.has(i)) this.sel = i; });
  }
  update(dt) {
    super.update(dt);
    this.pt += dt; this.dimA = Math.min(215, this.dimA + dt * 400);
    if (this.shake > 0) this.shake -= dt;
    if (this.phase === "fight" && this.nhints < this.hints.length && this.pt > 5 * this.nhints) this.nhints++;
    for (const p of this.burst) { p[0] += p[2] * dt; p[1] += p[3] * dt; p[3] += 120 * dt; p[4] -= dt; }
    this.burst = this.burst.filter(p => p[4] > 0);
  }
  draw(ctx) {
    const g = this.g, a = g.art;
    dim(ctx, this.dimA);
    let img;
    if (this.phase === "fight") { const fr = a.shadows[this.animal].right; img = fr[Math.floor(this.t * 4) % fr.length]; }
    else { const fr = a.animals[this.animal].right; img = fr[Math.floor(this.t * 3) % fr.length]; }
    let k = img.width < 50 ? 3.2 : 2.4;
    if (this.phase === "fight") k *= 1 + 0.04 * Math.sin(this.t * 3) + 0.04 * this.removed.size;
    const w = img.width * k, h = img.height * k, ox = this.shake > 0 ? Math.sin(this.shake * 50) * 14 : 0;
    const rx = WIDTH / 2 + ox - w / 2, ry = 210 - h / 2;
    if (this.phase === "fight") for (let i = 0; i < 6; i++) { ctx.fillStyle = "rgba(70,40,110,0.09)"; ctx.beginPath(); ctx.ellipse(WIDTH / 2 + ox, 210, w / 2 + 60 - i * 9, h / 2 + 60 - i * 9, 0, 0, TAU); ctx.fill(); }
    drawImg(ctx, img, rx, ry, k);
    if (this.phase === "fight") {
      const ex = rx + w * (this.animal !== "owl" ? 0.72 : 0.35), ey = ry + h * (this.animal !== "owl" ? 0.28 : 0.35);
      for (const dx of (this.animal !== "owl" ? [0] : [0, w * 0.3])) {
        ctx.fillStyle = "rgb(255,240,140)"; ctx.beginPath(); ctx.arc(ex + dx, ey, 5, 0, TAU); ctx.fill();
        ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(ex + dx, ey, 2, 0, TAU); ctx.fill();
      }
      const de = WORDS[this.key].de, show = this.removed.size;
      drawText(ctx, [...de].map((c, i) => i < show ? c : "_").join(" "), WIDTH / 2, 330, 38, MUTED, { center: true });
      let y = 365;
      for (const h2 of this.hints.slice(0, this.nhints)) { drawMixed(ctx, h2, g.known, [140, y, WIDTH - 280, 40], 27, null, g.name); y += 30; }
      drawText(ctx, "Назови тень по имени, и она снова станет собой:", WIDTH / 2, 470, 26, GOLD, { center: true });
      const n = this.options.length, bw = 230, x0 = WIDTH / 2 - (n * bw + (n - 1) * 16) / 2;
      this.rects = [];
      this.options.forEach((k2, i) => {
        const r = [x0 + i * (bw + 16), 500, bw, 60];
        this.rects.push(r);
        if (this.removed.has(i)) { roundRect(ctx, r[0], r[1], r[2], r[3], 12); ctx.strokeStyle = "rgb(60,50,70)"; ctx.lineWidth = 2; ctx.stroke(); drawText(ctx, withArticle(k2), r[0] + bw / 2, r[1] + 30, 30, [90, 80, 100], { center: true }); return; }
        const sel = i === this.sel && !g.touch;
        panel(ctx, r, { color: sel ? PANEL2 : PANEL, border: sel ? GOLD : MUTED, width: sel ? 3 : 2 });
        drawText(ctx, withArticle(k2), r[0] + bw / 2, r[1] + 30, 32, light(wordColor(k2), 0.3), { center: true, bold: true });
      });
    } else {
      const d = WORDS[this.key];
      drawHat(ctx, WIDTH / 2, 352, hatColor(d.art), 1.2);
      drawText(ctx, withArticle(this.key), WIDTH / 2, 390, 64, light(wordColor(this.key), 0.2), { center: true, bold: true });
      drawMixed(ctx, d.feel, g.known, [160, 440, WIDTH - 320, 80], 28, null, g.name);
      if (this.pt > 0.8 && Math.floor(this.pt * 2.5) % 2 === 0) drawText(ctx, tapHint(g), WIDTH / 2, 600, 26, MUTED, { center: true });
    }
    for (const p of this.burst) { ctx.fillStyle = rgb(p[5]); ctx.fillRect(p[0] - 2, p[1] - 2, 5, 5); }
  }
}

// ---------------------------------------------------------------------------- "Opa says": commands for the body
const CMD_KEYS = { links: ["ВЛЕВО", "left"], rechts: ["ВПРАВО", "right"], gehen: ["ВВЕРХ", "up"], springen: ["ПРОБЕЛ", "space"], laufen: ["SHIFT", "shift"], halt: ["замри!", null] };
const CMD_TEXT = { links: "Links!", rechts: "Rechts!", gehen: "Geh!", springen: "Spring!", laufen: "Lauf!", halt: "Halt!" };
const CMD_BTN = [["links", "←"], ["gehen", "↑"], ["rechts", "→"], ["springen", "прыжок"], ["laufen", "бег"]];

class OpaSays extends Action {
  constructor(commands, need, hints, timeLimit) {
    super(); this.commands = commands; this.need = need || 6; this.hints = hints !== false; this.timeLimit = timeLimit || 3.2;
    this.score = 0; this.cmd = null; this.ct = 0; this.state = "wait"; this.st = 0; this.heroAnim = null; this.msg = ""; this.last = null; this.btnRects = [];
  }
  start(g) { super.start(g); if (g.touch) this.timeLimit += 0.8; this.nextCmd(); }
  autoplay() { if (!this.done) { for (const c of this.commands) this.g.use(c); this.done = true; } }
  nextCmd() {
    const opts = this.commands.filter(c => c !== this.last);
    this.cmd = choice(opts.length ? opts : this.commands); this.last = this.cmd; this.ct = 0; this.state = "ask";
    this.g.audio.say(CMD_TEXT[this.cmd]); this.g.lastGerman = CMD_TEXT[this.cmd];
  }
  judge(ok) {
    this.state = ok ? "ok" : "bad"; this.st = 0;
    if (ok) { this.score++; this.g.audio.play("ok", 0.6); this.g.use(this.cmd); this.msg = choice(["<Gut!>", "<Ja!>", "<Super!>", "Отлично!", "<Ja, ja!>"]); }
    else { this.score = Math.max(0, this.score - 1); this.g.audio.play("wrong", 0.6); this.msg = choice(["Ха-ха, руки-ноги перепутались!", "Ой! <Nein, nein!>", "Не спеши, сначала послушай.", "<Nein!> Давай ещё разок."]); }
  }
  press(c) { if (this.state !== "ask") return; this.heroAnim = [c, 0]; this.judge(c === this.cmd); }
  handle(ev) {
    if (this.state === "won") { if (isConfirm(ev) && this.st > 0.8) this.done = true; return; }
    if (ev.type === "tap") { for (const [r, c] of this.btnRects) if (inRect(r, ev.x, ev.y)) this.press(c); return; }
    if (ev.type !== "key") return;
    for (const [c, [, k]] of Object.entries(CMD_KEYS)) if (k && ev.key === k) { this.press(c); return; }
  }
  update(dt) {
    super.update(dt);
    this.dimA = Math.min(200, this.dimA + dt * 500); this.ct += dt; this.st += dt;
    if (this.heroAnim) this.heroAnim[1] += dt;
    if (this.state === "ask" && this.ct > this.timeLimit) {
      if (this.cmd === "halt") { this.heroAnim = ["halt", 0]; this.judge(true); } else this.judge(false);
    } else if ((this.state === "ok" || this.state === "bad") && this.st > 1.1) {
      this.heroAnim = null;
      if (this.score >= this.need) { this.state = "won"; this.st = 0; this.g.audio.play("chime"); } else this.nextCmd();
    }
  }
  draw(ctx) {
    const g = this.g;
    dim(ctx, this.dimA);
    const ar = [130, 150, WIDTH - 260, 300];
    roundRect(ctx, ar[0], ar[1], ar[2], ar[3], 24); ctx.fillStyle = "rgb(96,150,70)"; ctx.fill(); ctx.strokeStyle = "rgb(70,120,56)"; ctx.lineWidth = 4; ctx.stroke();
    const opa = g.art.people.opa.right[0];
    drawImg(ctx, opa, ar[0] + 30, ar[1] + ar[3] - opa.height * 2 - 20, 2);
    const hs = g.art.people.hero;
    let frame = hs.down[0], hx = ar[0] + ar[2] / 2 + 60, hy = ar[1] + ar[3] - 30;
    if (this.heroAnim) {
      const [c, t] = this.heroAnim;
      if (c === "links") { frame = hs.left[Math.floor(t * 8) % 3]; hx -= Math.min(1, t * 3) * 90; }
      else if (c === "rechts") { frame = hs.right[Math.floor(t * 8) % 3]; hx += Math.min(1, t * 3) * 90; }
      else if (c === "gehen") { frame = hs.up[Math.floor(t * 8) % 3]; hy -= Math.min(1, t * 3) * 40; }
      else if (c === "springen") { hy -= Math.sin(Math.min(1, t * 2) * Math.PI) * 90; frame = hs.down[1]; }
      else if (c === "laufen") {
        frame = hs.right[Math.floor(t * 16) % 3]; hx += Math.sin(t * 20) * 6;
        for (let i = 0; i < 4; i++) { ctx.fillStyle = "rgb(200,190,160)"; ctx.beginPath(); ctx.arc(hx - 40 - i * 14, hy - 6 - (i % 2) * 4, 5 - i, 0, TAU); ctx.fill(); }
      }
    }
    drawImg(ctx, frame, hx - frame.width, hy - frame.height * 2, 2);
    if (["ask", "ok", "bad"].includes(this.state)) {
      const bub = [ar[0] + 120, ar[1] + 20, 300, 80];
      panel(ctx, bub, { color: [250, 246, 236], border: INK, alpha: 255 });
      drawText(ctx, CMD_TEXT[this.cmd], bub[0] + 150, bub[1] + 40, 56, INK, { center: true, shadow: false, bold: true });
      if (this.hints) {
        const ic = g.art.wordIcon(this.cmd);
        ctx.drawImage(ic, bub[0] + bub[2] + 14, bub[1] + 10);
        drawText(ctx, CMD_KEYS[this.cmd][0], bub[0] + bub[2] + 70, bub[1] + 26, 30, GOLD);
      }
      if (this.state === "ask") {
        const k = 1 - this.ct / this.timeLimit;
        ctx.fillStyle = "rgb(60,50,70)"; ctx.fillRect(ar[0] + 120, ar[1] + 108, 300, 8);
        ctx.fillStyle = rgb(this.cmd !== "halt" ? GOLD : MUTED); ctx.fillRect(ar[0] + 120, ar[1] + 108, 300 * Math.max(0, k), 8);
      } else {
        drawMixed(ctx, this.msg, g.known, [ar[0] + 120, ar[1] + 124, 400, 40], 30, null, g.name);
        ctx.fillStyle = rgb(this.state === "ok" ? GREEN : RED); ctx.beginPath(); ctx.arc(ar[0] + ar[2] - 40, ar[1] + 40, 18, 0, TAU); ctx.fill();
      }
    }
    for (let i = 0; i < this.need; i++) {
      ctx.fillStyle = rgb(i < this.score ? GOLD : [70, 60, 80]); ctx.beginPath(); ctx.arc(WIDTH / 2 - (this.need - 1) * 16 + i * 32, 480, 11, 0, TAU); ctx.fill();
    }
    if (this.state === "won") {
      drawText(ctx, "Sehr gut! Тело уже понимает по-немецки!", WIDTH / 2, 120, 40, GOLD, { center: true, bold: true });
      if (this.st > 0.8 && Math.floor(this.st * 2.5) % 2 === 0) drawText(ctx, tapHint(g), WIDTH / 2, 600, 26, MUTED, { center: true });
    } else drawText(ctx, g.touch ? "Опа командует, а ты делаешь. На «Halt!» замри и ничего не нажимай!" : "Опа командует, а ты делаешь: стрелки, ПРОБЕЛ, SHIFT. На «Halt!» замри!", WIDTH / 2, 120, 24, MUTED, { center: true });
    // big touch buttons for the commands
    this.btnRects = [];
    if (g.touch && this.state !== "won") {
      const bw = 150, gap = 14, x0 = WIDTH / 2 - (CMD_BTN.length * bw + (CMD_BTN.length - 1) * gap) / 2;
      CMD_BTN.forEach(([c, label], i) => {
        const r = [x0 + i * (bw + gap), 512, bw, 76];
        this.btnRects.push([r, c]);
        panel(ctx, r, { color: PANEL2, border: MUTED, alpha: 240, radius: 16 });
        drawText(ctx, label, r[0] + bw / 2, r[1] + 38, label.length < 3 ? 60 : 34, WHITE, { center: true, bold: true });
      });
    }
  }
}

// ---------------------------------------------------------------------------- counting
const NUM_KEYS = ["eins", "zwei", "drei", "vier", "fuenf"];
class Count extends Action {
  constructor(imgKey, n, mode, isAnimal) { super(); this.imgKey = imgKey; this.n = n; this.mode = mode || "ask"; this.isAnimal = !!isAnimal; this.appeared = 0; this.at = 0; this.sel = 0; this.state = "appear"; this.st = 0; this.rects = []; }
  start(g) {
    super.start(g);
    this.img = this.isAnimal ? g.art.animals[this.imgKey].right[0] : g.art.get(this.imgKey);
    if (this.mode === "ask") { g.audio.say("Wie viele?"); g.lastGerman = "Wie viele?"; }
  }
  autoplay() { if (!this.done) { this.result = true; this.done = true; } }
  update(dt) {
    super.update(dt);
    this.dimA = Math.min(200, this.dimA + dt * 500); this.at += dt; this.st += dt;
    const gap = this.mode === "show" ? 0.9 : 0.35;
    if (this.appeared < this.n && this.at > gap) {
      this.at = 0; this.appeared++; this.g.audio.play(this.isAnimal ? "baa" : "stone", 0.5);
      if (this.mode === "show") this.g.audio.say(WORDS[NUM_KEYS[this.appeared - 1]].de);
    }
    if (this.appeared >= this.n && this.state === "appear" && this.at > 0.8) { this.state = this.mode === "ask" ? "choose" : "shown"; this.st = 0; }
  }
  pick(i) {
    if (this.state !== "choose") return;
    if (i === this.n - 1) { this.state = "right"; this.g.audio.play("ok"); this.g.audio.say(WORDS[NUM_KEYS[i]].de); this.g.use(NUM_KEYS[i]); this.result = true; }
    else { this.g.audio.play("wrong"); this.state = "wrongpick"; this.wrong = i; }
    this.st = 0;
  }
  handle(ev) {
    if (this.state === "right" || this.state === "shown") { if (isConfirm(ev) && this.st > 0.5) this.done = true; return; }
    if (this.state === "wrongpick") { if (this.st > 0.6) this.state = "choose"; else return; }
    if (this.state !== "choose") return;
    if (ev.type === "key") {
      if (ev.key === "left") this.sel = (this.sel + 4) % 5;
      else if (ev.key === "right") this.sel = (this.sel + 1) % 5;
      else if (/^[1-5]$/.test(ev.key)) this.pick(+ev.key - 1);
      else if (isConfirm(ev)) this.pick(this.sel);
    } else if (ev.type === "tap") this.rects.forEach((r, i) => { if (inRect(r, ev.x, ev.y)) this.pick(i); });
    else if (ev.type === "move") this.rects.forEach((r, i) => { if (inRect(r, ev.x, ev.y)) this.sel = i; });
  }
  draw(ctx) {
    const g = this.g;
    dim(ctx, this.dimA);
    const k = this.img.width < 50 ? 3 : 2, w = this.img.width * k + 20, h = this.img.height * k, x0 = WIDTH / 2 - this.n * w / 2;
    for (let i = 0; i < this.appeared; i++) {
      drawImg(ctx, this.img, x0 + i * w + 10, 230 - h / 2 + Math.sin(this.t * 4 + i) * 4, k);
      if (this.mode === "show" || this.state === "right") drawText(ctx, WORDS[NUM_KEYS[i]].de, x0 + i * w + w / 2, 300 + h / 2 - 30, 34, GOLD, { center: true, bold: true });
    }
    if (this.mode === "ask") {
      drawText(ctx, "Wie viele?", WIDTH / 2, 90, 56, DE, { center: true, bold: true });
      drawText(ctx, "(сколько?)", WIDTH / 2, 132, 24, MUTED, { center: true });
      if (["choose", "wrongpick", "right"].includes(this.state)) {
        this.rects = [];
        const bw = 150, xx = WIDTH / 2 - (5 * bw + 48) / 2;
        NUM_KEYS.forEach((kk, i) => {
          const r = [xx + i * (bw + 12), 470, bw, 60];
          this.rects.push(r);
          const sel = i === this.sel && !g.touch;
          let border = sel ? GOLD : MUTED;
          if (this.state === "wrongpick" && i === this.wrong) border = RED;
          if (this.state === "right" && i === this.n - 1) border = GREEN;
          panel(ctx, r, { color: sel ? PANEL2 : PANEL, border, width: sel ? 3 : 2 });
          drawText(ctx, WORDS[kk].de, r[0] + bw / 2, r[1] + 30, 34, g.known[kk] ? GOLD : WHITE, { center: true, bold: true });
        });
      }
    }
    if ((this.state === "right" || this.state === "shown") && this.st > 0.5 && Math.floor(this.st * 2.5) % 2 === 0) drawText(ctx, tapHint(g), WIDTH / 2, 600, 26, MUTED, { center: true });
  }
}

// ---------------------------------------------------------------------------- misc
class NameEntry extends Action {
  constructor(def) { super(); this.def = def || "Мика"; this.asked = false; }
  start(g) {
    super.start(g);
    if (g.auto) return;
    g.askText("Как тебя будут звать?", this.def, v => {
      v = (v || "").trim() || this.def;
      v = v.slice(0, 14); this.result = v[0].toUpperCase() + v.slice(1); this.done = true;
    });
  }
  autoplay() { this.result = this.def; this.done = true; }
  draw(ctx) { dim(ctx, 170); }
}

class Title extends Action {
  constructor(top, big, sub) { super(); this.top = top; this.big = big; this.sub = sub; }
  start(g) { super.start(g); g.audio.play("chime"); g.audio.say(this.big); }
  handle(ev) { if (isConfirm(ev) && this.t > 0.8) this.done = true; }
  update(dt) { super.update(dt); if (this.t > 4) this.done = true; }
  draw(ctx) {
    const a = this.t < 3.4 ? Math.min(1, this.t * 2) : Math.max(0, (4 - this.t) / 0.6);
    dim(ctx, 210 * a);
    if (a > 0.1) {
      drawText(ctx, this.top, WIDTH / 2, 230, 30, MUTED, { center: true, alpha: a });
      drawText(ctx, this.big, WIDTH / 2, 300, 84, DE, { center: true, bold: true, alpha: a });
      drawText(ctx, this.sub, WIDTH / 2, 370, 32, WHITE, { center: true, alpha: a });
      ctx.fillStyle = rgb(GOLD, a); ctx.fillRect(WIDTH / 2 - 160, 410, 320, 2);
    }
  }
}
class Fade extends Action {
  constructor(toBlack, dur) { super(); this.toBlack = toBlack !== false; this.dur = dur || 0.8; }
  start(g) { super.start(g); g.fadeLevel = this.toBlack ? 0 : 255; }
  update(dt) {
    this.t += dt;
    const k = Math.min(1, this.t / this.dur);
    this.g.fadeLevel = 255 * (this.toBlack ? k : 1 - k);
    if (k >= 1 || this.g.auto) { this.g.fadeLevel = this.toBlack ? 255 : 0; this.done = true; }
  }
}
class Wait extends Action {
  constructor(dur) { super(); this.dur = dur; }
  update(dt) { super.update(dt); if (this.t >= this.dur) this.done = true; }
}
class WaitWalk extends Action {
  constructor(...ents) { super(); this.ents = ents; }
  update(dt) {
    this.t += dt;
    if (this.ents.every(e => !e.path.length) || this.t > 12) this.done = true;
    if (this.g.auto) { for (const e of this.ents) if (e.path.length) { [e.x, e.y] = e.path[e.path.length - 1]; e.path = []; } this.done = true; }
  }
}

// ============================================================================
// game: the engine. World drawing, the hero, keyboard + touch controls,
// HUD, the Word Book, menu, title screen, saving (localStorage), scripts.
// ============================================================================
const SAVE_KEY = "wortwald_save_v1";

function storeGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }

class Game {
  constructor(canvas, opts) {
    opts = opts || {};
    this.canvas = canvas; this.ctx = canvas.getContext("2d");
    this.auto = !!opts.auto; this.touch = false;
    this.art = new Art(); this.art.build();
    this.audio = new Audio();
    this.state = "title"; this.titleSel = 0; this.time = 0;
    this.scaledCache = new Map(); this.portraitCache = {};
    this.keys = new Set(); this.joy = null; this.runHeld = false; this.btns = [];
    this.darkCanvas = makeCanvas(WIDTH, HEIGHT);
    this.newState();
  }

  // ------------------------------------------------------------------ state
  newState() {
    this.world = new World();
    this.player = new Player(31, 88); this.player.dir = "up";
    this.known = {}; this.flags = new Set(); this.name = "Мика"; this.goalText = ""; this.chapterLabel = "";
    this.abilities = new Set(); this.script = null; this.action = null; this.queue = []; this.lastResult = null;
    this.toasts = []; this.particles = []; this.emotes = []; this.playTime = 0; this.cam = [0, 0];
    this.fadeLevel = 0; this.overlay = null; this.lastGerman = ""; this.shake = 0; this.bumpCool = 0;
    this.lantern = false; this.darkness = 0; this.portraitCache = {};
    Story.populate(this);
  }
  has(f) { return this.flags.has(f); }
  flag(f) { this.flags.add(f); }
  goal(text, label) { this.goalText = text; if (label !== undefined) this.chapterLabel = label; }
  learn(key, silent) {
    const isNew = !this.known[key];
    this.known[key] = (this.known[key] || 0) + 1;
    if (isNew) { this.toast("Новое слово: " + withArticle(key), wordColor(key)); if (!silent) this.audio.play("word"); }
    this.portraitCache = {};
  }
  use(key, n) { if (this.known[key]) this.known[key] += (n || 1); }
  toast(text, color) { this.toasts.push([text, color || GOLD, 3.2]); }
  color(name) {
    this.flags.add("col:" + name); this.portraitCache = {};
    const e = this.world.ent[name]; if (e) this.sparkle(e.x, e.y - 30, 30);
  }
  isColored(name) {
    if (name === "hero") return this.flags.has("col:hero");
    if (this.flags.has("col:" + name)) return true;
    const e = this.world.ent[name];
    return e ? !!this.world.colored[this.world.zoneAt(e.x, e.y)] : false;
  }
  sparkle(x, y, n, colors) {
    for (let i = 0; i < (n || 24); i++) {
      const a = Math.random() * TAU, sp = uniform(30, 160);
      this.particles.push([x, y, Math.cos(a) * sp, Math.sin(a) * sp - 40, uniform(0.5, 1.2), choice(colors || [GOLD, [255, 255, 255], [150, 220, 255], [255, 160, 200]])]);
    }
  }
  emote(ent, sym, dur) { this.emotes.push([ent, sym, dur || 1.6]); }
  speakerSprite(sp) { const e = this.world.ent[sp]; if (e) return e.sprite; return (SPEAKERS[sp] || [sp, sp])[1]; }
  speakerName(sp) { return sp === "hero" ? this.name : (SPEAKERS[sp] || [sp])[0]; }
  // factories for scripts
  say(sp, text) { return new Say(sp, text); }
  think(text) { return new Say("think", text); }
  narr(text) { return new Say(null, text); }
  choice(sp, prompt, options, correct, image) { return new Choice(sp, prompt, options, correct, image); }
  spark(key, feel, effect, image, fast) { return new Spark(key, feel, effect, image, fast); }
  wait(t) { return new Wait(t); }
  walk(ent, tx, ty, speed) { ent.walkTo(tx, ty, speed); return new WaitWalk(ent); }
  run(gen) { if (gen) this.queue.push(gen); }
  busy() { return !!(this.script || this.action || this.queue.length); }

  // ------------------------------------------------------------------ save / load
  save() {
    if (this.auto) return;
    const data = { name: this.name, known: this.known, flags: [...this.flags], pos: [this.player.x, this.player.y], goal: this.goalText,
      label: this.chapterLabel, abilities: [...this.abilities], playTime: this.playTime, version: 1 };
    storeSet(SAVE_KEY, JSON.stringify(data));
  }
  hasSave() { return !!storeGet(SAVE_KEY); }
  load() {
    let d; try { d = JSON.parse(storeGet(SAVE_KEY)); } catch (e) { return false; }
    if (!d) return false;
    this.newState();
    this.name = d.name || "Мика";
    for (const [k, v] of Object.entries(d.known || {})) if (WORDS[k]) this.known[k] = v;
    this.flags = new Set(d.flags || []); this.abilities = new Set(d.abilities || []);
    this.goalText = d.goal || ""; this.chapterLabel = d.label || ""; this.playTime = d.playTime || 0;
    if (d.pos) { this.player.x = d.pos[0]; this.player.y = d.pos[1]; }
    Story.applyFlags(this);
    return true;
  }

  // ------------------------------------------------------------------ scripts
  stepScript() {
    for (let guard = 0; guard < 200; guard++) {
      if (this.action) { if (this.action.done) { this.lastResult = this.action.result; this.action = null; continue; } return; }
      if (!this.script) { if (!this.queue.length) return; this.script = this.queue.shift(); this.lastResult = null; }
      let r;
      try { r = this.script.next(this.lastResult); } catch (e) { console.error(e); r = { done: true }; }
      this.lastResult = null;
      if (r.done) { this.script = null; if (!this.queue.length) { Story.afterScript(this); this.save(); } continue; }
      if (!r.value) continue;
      this.action = r.value; this.action.start(this);
    }
  }

  // ------------------------------------------------------------------ input
  keyEvent(key, down) {
    if (down) this.keys.add(key); else { this.keys.delete(key); return; }
    this.audio.unlock();
    this.handle({ type: "key", key });
  }
  pointerDown(id, x, y, isTouch) {
    this.audio.unlock();
    if (isTouch && !this.touch) { this.touch = true; }
    if (this.state === "play" && !this.overlay && !this.busy() && isTouch) {
      for (const b of this.btns) if (Math.hypot(x - b.x, y - b.y) < b.r + 10) { b.down(id); return; }
      if (x < WIDTH * 0.55 && y > 120) { this.joy = { id, cx: x, cy: y, x, y }; return; }
    }
    this.handle({ type: "tap", x, y });
  }
  pointerMove(id, x, y) {
    if (this.joy && this.joy.id === id) { this.joy.x = x; this.joy.y = y; return; }
    this.handle({ type: "move", x, y });
  }
  pointerUp(id) {
    if (this.joy && this.joy.id === id) this.joy = null;
    if (this.runHeld === id) this.runHeld = false;
  }
  touchButtons() {
    const b = [];
    b.push({ name: "e", x: WIDTH - 92, y: 540, r: 56, label: "E", down: () => this.interact() });
    if (this.abilities.has("springen")) b.push({ name: "jump", x: WIDTH - 214, y: 582, r: 44, label: "прыжок", down: () => this.tryJump() });
    if (this.abilities.has("laufen")) b.push({ name: "run", x: WIDTH - 204, y: 464, r: 40, label: "бег", down: id => { this.runHeld = id; } });
    b.push({ name: "book", x: WIDTH - 80, y: 30, r: 34, label: "", down: () => { this.overlay = new Book(this); this.audio.play("page"); } });
    b.push({ name: "menu", x: WIDTH - 196, y: 30, r: 26, label: "", down: () => { this.overlay = new Menu(this); } });
    this.btns = b;
  }
  handle(ev) {
    if (this.state === "title") { this.handleTitle(ev); return; }
    if (this.overlay) { this.overlay.handle(ev); return; }
    if (ev.type === "key") {
      if (ev.key === "m") { this.audio.toggleMusic(); this.toast("Музыка: " + (this.audio.musicOn ? "вкл" : "выкл"), MUTED); return; }
      if (ev.key === "r" && this.lastGerman) { this.audio.say(this.lastGerman); return; }
      if (ev.key === "v") { this.audio.voiceOn = !this.audio.voiceOn; this.toast("Голос: " + (this.audio.voiceOn ? "вкл" : "выкл"), MUTED); return; }
    }
    if (this.action) { this.action.handle(ev); return; }
    if (ev.type === "key") {
      if (ev.key === "esc") this.overlay = new Menu(this);
      else if (ev.key === "tab") { this.overlay = new Book(this); this.audio.play("page"); }
      else if (ev.key === "e" || ev.key === "enter") this.interact();
      else if (ev.key === "space") this.tryJump();
    } else if (ev.type === "tap") {
      // mouse users: click the book counter / menu
      if (inRect([WIDTH - 150, 10, 138, 40], ev.x, ev.y)) { this.overlay = new Book(this); this.audio.play("page"); }
    }
  }
  titleOptions() { const o = ["Новая игра"]; if (this.hasSave()) o.unshift("Продолжить"); return o; }
  handleTitle(ev) {
    const opts = this.titleOptions();
    if (ev.type === "key") {
      if (ev.key === "up") this.titleSel = (this.titleSel - 1 + opts.length) % opts.length;
      else if (ev.key === "down") this.titleSel = (this.titleSel + 1) % opts.length;
      else if (isConfirm(ev)) this.titlePick(opts[this.titleSel]);
    } else if (ev.type === "tap") {
      opts.forEach((o, i) => { if (inRect([WIDTH / 2 - 160, 370 + i * 64, 320, 54], ev.x, ev.y)) this.titlePick(o); });
      if (this.fullscreenBtn && inRect(this.fullscreenBtn, ev.x, ev.y) && this.onFullscreen) this.onFullscreen();
    } else if (ev.type === "move") opts.forEach((o, i) => { if (inRect([WIDTH / 2 - 160, 370 + i * 64, 320, 54], ev.x, ev.y)) this.titleSel = i; });
  }
  titlePick(o) {
    this.audio.unlock(); this.audio.play("ok");
    if (o === "Продолжить" && this.load()) { this.state = "play"; this.fadeLevel = 255; this.run(Story.resume(this)); }
    else { this.newState(); this.state = "play"; this.run(Story.prologue(this)); }
  }
  askText(title, def, cb) {
    if (this.onAskText) this.onAskText(title, def, cb); else cb(def);
  }

  // ------------------------------------------------------------------ update
  update(dt) {
    this.time += dt;
    this.audio.tickMusic();
    if (this.state === "title") {
      this.cam[0] = 31 * TILE - WIDTH / 2 + Math.sin(this.time * 0.1) * 200; this.cam[1] = 82 * TILE - HEIGHT / 2;
      for (const e of this.world.entities) e.update(dt, this.world);
      this.audio.setMusic("village", true);
      return;
    }
    if (this.overlay) { this.overlay.update(dt); return; }
    this.playTime += dt;
    this.stepScript();
    if (this.action) this.action.update(dt);
    this.stepScript();
    for (const e of this.world.entities) e.update(dt, this.world);
    this.updatePlayer(dt);
    const p = this.player;
    const tx = clamp(p.x - WIDTH / 2, 0, MW * TILE - WIDTH), ty = clamp(p.y - 20 - HEIGHT / 2, 0, MH * TILE - HEIGHT);
    const k = 1 - Math.exp(-dt * 8);
    this.cam[0] += (tx - this.cam[0]) * k; this.cam[1] += (ty - this.cam[1]) * k;
    if (this.shake > 0) this.shake -= dt;
    for (const q of this.particles) { q[0] += q[2] * dt; q[1] += q[3] * dt; q[3] += 90 * dt; q[4] -= dt; }
    this.particles = this.particles.filter(q => q[4] > 0);
    for (const t of this.toasts) t[2] -= dt;
    this.toasts = this.toasts.filter(t => t[2] > 0).slice(-4);
    for (const e of this.emotes) e[2] -= dt;
    this.emotes = this.emotes.filter(e => e[2] > 0);
    this.bumpCool -= dt;
    const tile = this.world.tileAt(Math.floor(p.x / TILE), Math.floor((p.y - 4) / TILE));
    this.darkness += ((tile === "d" ? 1 : 0) - this.darkness) * (1 - Math.exp(-dt * 4));
    const z = this.world.zoneAt(p.x, p.y);
    this.audio.setMusic(this.has("ending") ? "festival" : { village: "village", meadow: "village", forest: "forest", tower: "tower" }[z], this.has("ending") || !!this.world.colored[z]);
    if (!this.busy()) Story.checkTriggers(this);
  }
  moveInput() {
    let dx = (this.keys.has("right") ? 1 : 0) - (this.keys.has("left") ? 1 : 0);
    let dy = (this.keys.has("down") ? 1 : 0) - (this.keys.has("up") ? 1 : 0);
    let mag = 1;
    if (this.joy) {
      const jx = this.joy.x - this.joy.cx, jy = this.joy.y - this.joy.cy, d = Math.hypot(jx, jy);
      if (d > 12) { dx = jx / d; dy = jy / d; mag = Math.min(1, d / 60); }
    }
    return [dx, dy, mag];
  }
  updatePlayer(dt) {
    const p = this.player;
    p.anim += dt;
    p.scale += (p.targetScale - p.scale) * (1 - Math.exp(-dt * 6));
    if (p.shiver > 0) p.shiver -= dt;
    if (p.jumpT > 0) {
      p.jumpT += dt;
      const k = Math.min(1, p.jumpT / 0.45);
      p.x = p.jumpFrom[0] + (p.jumpTo[0] - p.jumpFrom[0]) * k; p.y = p.jumpFrom[1] + (p.jumpTo[1] - p.jumpFrom[1]) * k;
      if (k >= 1) { p.jumpT = 0; this.audio.play("land"); }
      return;
    }
    p.moving = false;
    if (this.busy() || this.overlay) return;
    let [dx, dy, mag] = this.moveInput();
    if (!dx && !dy) return;
    if (Math.abs(dx) >= Math.abs(dy)) p.dir = dx > 0 ? "right" : "left"; else p.dir = dy > 0 ? "down" : "up";
    const running = (this.keys.has("shift") || this.runHeld !== false) && this.abilities.has("laufen");
    let sp = 120 * (running ? 1.75 : 1) * (p.size === "small" ? 0.85 : 1) * Math.max(0.5, mag);
    const len = Math.hypot(dx, dy); dx /= len; dy /= len;
    const small = p.size === "small";
    let moved = false;
    for (const [ax, ay] of [[dx, 0], [0, dy]]) {
      if (!ax && !ay) continue;
      const r = p.rect(), nx = p.x + ax * sp * dt, ny = p.y + ay * sp * dt;
      const nr = [nx - r[2] / 2, ny - r[3], r[2], r[3]];
      if (!this.world.blockedRect(nr, small, p) && nr[0] > 0 && nr[0] + nr[2] < MW * TILE) { p.x = nx; p.y = ny; moved = true; }
      else if (Math.abs(ax) > 0.3 || Math.abs(ay) > 0.3) this.bump(nr);
    }
    p.moving = moved;
    if (moved) {
      p.stepT += dt * (running ? 1.6 : 1);
      if (p.stepT > 0.28) { p.stepT = 0; this.audio.play("step", 0.5); }
      if (running && Math.random() < 0.3) this.particles.push([p.x - (p.dir === "right" ? 8 : -8), p.y - 2, uniform(-20, 20), -uniform(5, 25), 0.4, [200, 186, 150]]);
    }
  }
  bump(r) {
    if (this.bumpCool > 0) return;
    const tiles = new Set();
    for (let ty = Math.floor(r[1] / TILE); ty <= Math.floor((r[1] + r[3] - 1) / TILE); ty++)
      for (let tx = Math.floor(r[0] / TILE); tx <= Math.floor((r[0] + r[2] - 1) / TILE); tx++) tiles.add(tx + "," + ty);
    const gen = Story.onBump(this, tiles);
    if (gen) { this.bumpCool = 1.5; this.run(gen); }
  }
  facingVec() { return { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[this.player.dir]; }
  tryJump() {
    const p = this.player;
    if (!this.abilities.has("springen") || p.jumpT > 0 || this.busy()) return;
    if (p.size === "big") { this.toast("Слишком тяжёлый, чтобы прыгать!", MUTED); return; }
    const [vx, vy] = this.facingVec();
    for (const dist of [2.2, 1.2]) {
      const tx = p.x + vx * TILE * dist, ty = p.y + vy * TILE * dist, r = p.rect();
      const nr = [tx - r[2] / 2, ty - r[3], r[2], r[3]];
      if (!this.world.blockedRect(nr, p.size === "small", p)) {
        const mx = Math.floor((p.x + vx * TILE * dist / 2) / TILE), my = Math.floor((p.y - 4 + vy * TILE * dist / 2) / TILE);
        const mid = this.world.tileAt(mx, my);
        if (mid === "r") continue;
        if (this.world.foot.has(mx + "," + my) && !"sw".includes(mid)) {
          const big = this.world.props.some(pp => pp.foot.some(([a, b]) => a === mx && b === my) && /^(t|pine|house|tower|hedge|boulder|gate)/.test(pp.name));
          if (big) continue;
        }
        p.jumpFrom = [p.x, p.y]; p.jumpTo = [tx, ty]; p.jumpT = 0.0001; this.audio.play("jump");
        return;
      }
    }
    p.jumpFrom = [p.x, p.y]; p.jumpTo = [p.x, p.y]; p.jumpT = 0.0001; this.audio.play("jump");
  }
  findTarget() {
    const p = this.player, [vx, vy] = this.facingVec();
    const fx = p.x + vx * 22, fy = p.y - 10 + vy * 22;
    let best = null, bd = 1e9;
    for (const e of this.world.entities) {
      if (!e.visible || !e.talk) continue;
      const d = Math.hypot(e.x - fx, e.y - 10 - fy);
      if (d < e.reach * (this.touch ? 1.3 : 1) && d < bd) { best = e; bd = d; }
    }
    for (const pr of this.world.props) {
      if (!pr.visible || !pr.interact) continue;
      const d = Math.hypot(pr.x - fx, pr.y - 12 - fy), reach = (pr.reach + (pr.w - 1) * 16) * (this.touch ? 1.25 : 1);
      if (d < reach && d < bd) { best = pr; bd = d; }
    }
    return best;
  }
  interact() {
    if (this.busy()) return;
    const t = this.findTarget();
    if (!t) return;
    if (t instanceof Entity) { t.face(this.player); this.player.face(t); this.run(t.talk(this, t)); }
    else this.run(t.interact(this, t));
  }

  // ------------------------------------------------------------------ drawing
  zoneCol(ty) { return !!this.world.colored[zoneOfRow(ty)]; }
  draw() {
    const ctx = this.ctx;
    ctx.imageSmoothingEnabled = false;
    this.drawWorld(ctx);
    if (this.state === "title") { this.drawTitle(ctx); return; }
    this.drawHud(ctx);
    if (this.action) this.action.draw(ctx);
    if (this.fadeLevel > 0) {
      ctx.fillStyle = `rgba(8,6,14,${this.fadeLevel / 255})`; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      if (this.action instanceof Say && this.fadeLevel > 200) this.action.draw(ctx);
    }
    if (this.touch && this.state === "play" && !this.overlay && !this.busy()) this.drawTouch(ctx);
    if (this.overlay) this.overlay.draw(ctx);
    this.drawToasts(ctx);
  }
  drawWorld(ctx) {

// ============================================================================
// story: who lives where, what they say, and every chapter.
// Rule of every chapter: the body FEELS a thing first, then the word is born,
// then it is USED at once - and from then on it replaces Russian in dialogue.
// v2: all Russian text rewritten to sound like people actually talk.
// ============================================================================
const SPEAKERS = {

const COLORS = ["rot", "blau", "gruen", "gelb", "weiss"];
const PAINT_ORDER = ["rot", "gruen", "gelb", "weiss", "blau"];

// ------------------------------------------------------------------ helpers
function pic(g, kind, name) {
  const a = g.art;
  if (kind === "person") return [a.people[name].down[0], a.peopleGrey[name].down[0]];
  if (kind === "animal") return [a.animals[name].right[0], a.animalsGrey[name].right[0]];
  return [a.get(name), a.get(name, true)];
}
function iconBig(g, key, k) { const ic = g.art.wordIcon(key); k = k || 2; return scaledCanvas(ic, ic.width * k, ic.height * k); }
function big2(img) { return scaledCanvas(img, img.width * 2, img.height * 2); }
function ent(g, name) { return g.world.ent[name]; }
function tileOf(e) { return [Math.floor(e.x / TILE), Math.floor((e.y - 4) / TILE)]; }
function place(e, tx, ty, facing) { e.x = (tx + 0.5) * TILE; e.y = (ty + 1) * TILE - 4; e.home = [e.x, e.y]; e.path = []; if (facing) e.dir = facing; }
function countKnown(g, keys) { return keys.filter(k => g.known[k]).length; }
function cap(s) { return s[0].toUpperCase() + s.slice(1); }
function* askUntil(g, sp, prompt, options, correct, retorts, image) {
  while (true) {
    const r = yield g.choice(sp, prompt, options, correct, image);
    if (r === correct) return r;
    const line = retorts && retorts[r];
    if (line) yield g.say(sp, line);
  }
}
function sayOnce(g, sp, text) { return (function* () { yield sp === "think" ? g.think(text) : g.say(sp, text); })(); }

// ------------------------------------------------------------------ population
function populate(g) {
  const wd = g.world;
  const person = (n, s, x, y, f) => wd.addEnt(new Entity(n, s, x, y, "person", f || "down"));
  const animal = (n, s, x, y, f) => wd.addEnt(new Entity(n, s, x, y, "animal", f || "right"));
  person("oma", "oma", 12, 82).talk = talkOma;
  const bello = animal("bello", "dog", 28, 89); bello.talk = talkBello; bello.wander = 2;
  const mimi = animal("mimi", "cat", 8, 82, "left"); mimi.talk = talkMimi; mimi.wander = 1.5;
  person("paul", "paul", 36, 89, "left").talk = talkKids;
  person("anna", "anna", 37, 89, "left").talk = talkKids;
  person("baker", "baecker", 18, 96).talk = talkBaker;
  person("klaus", "klaus", 48, 79).talk = talkKlaus;
  person("lotte", "lotte", 45, 73, "right").talk = talkLotte;
  person("opa", "opa", 27, 69).talk = talkOpa;
  for (let i = 0; i < 6; i++) {
    let s;
    if (i === 0) { s = animal("sheep0", "sheep", 52, 85); s.wander = 2; }
    else { const [x, y] = SHEEP_HOME[i - 1]; s = animal("sheep" + i, "sheep", x, y, "left"); s.wander = 1; }
    s.talk = talkSheep; s.solid = false;
  }
  for (const [k, d] of Object.entries(SHADOWS)) {
    const s = animal(k, d.sprite, d.pos[0], d.pos[1], "left"); s.shadow = true; s.talk = talkShadow; s.reach = 60;
  }
  person("magier", "magier", 31, 7).talk = talkMagier;
  const P = wd.propByName;
  for (const n of ["well", "house_oma", "bread", "bucket", "appletree", "bigtree", "flower"]) P[n].interact = touchThing;
  P.house_oma.word = "haus"; P.house_oma.reach = 50;
  for (const c of COLORS) P["pot_" + c].interact = touchPot;
  for (const n of ["fire", "icewater", "mush_blue", "mush_red", "lantern"]) P[n].interact = touchMeadow;
  P.deco8.interact = readSign;
  P.gate.interact = touchGate;
  const m2 = wd.add(new Prop("mush_blue2", "mushroom_blue", 12, 48, { solid: false, word: "klein" })); m2.interact = touchMeadow;
  applyFlags(g);
}

function applyFlags(g) {
  const wd = g.world, f = g.flags, P = wd.propByName;
  for (const z of Object.keys(wd.colored)) wd.colored[z] = f.has("zone:" + z);
  if (f.has("gate_open")) openGate(g, true);
  if (f.has("ch1_done")) place(ent(g, "oma"), 12, 83, "down");
  else if (f.has("oma_bread")) place(ent(g, "oma"), 30, 88, "down");
  for (const c of PAINT_ORDER) if (f.has("paint_" + c)) paint(g, c, true);
  for (let i = 1; i < 6; i++) if (f.has(`sheep${i}_in`) || f.has("ch4_done")) { const s = ent(g, "sheep" + i); place(s, 48 + i, 84 + (i % 3)); s.wander = 2; }
  if (f.has("boulder_gone")) { P.boulder.visible = false; wd.removeFoot(P.boulder); }
  if (f.has("lantern")) { g.lantern = true; P.lantern.visible = false; }
  for (const k of SHADOW_ORDER) if (f.has("named_" + k)) freeShadow(g, k, true);
  for (let i = 1; i < 5; i++) if (f.has("plank" + i)) buildPlank(g, i, true);
  if (f.has("ch10_done")) { ent(g, "magier").sprite = "magier_frei"; f.add("col:magier"); }
  if (f.has("ending")) festivalPositions(g);
  f.delete("small_from_s"); f.delete("small_from_n");
  g.player.size = "normal"; g.player.scale = g.player.targetScale = 1;
}
function* resume(g) { yield new Fade(false, 1.0); g.toast(`С возвращением, ${g.name}!`); }

// ------------------------------------------------------------------ triggers
function afterScript(g) {
  const f = g.flags;
  if (f.has("ch3") && !f.has("ch3_all")) {
    const n = countKnown(g, CH3_WORDS);
    if (n >= CH3_WORDS.length) { f.add("ch3_all"); g.goal("Все вещи вспомнили, как их зовут! Возвращайся к Оме."); }
    else g.goal(`Потрогай серые вещи у дома Омы и у колодца: ${n} из ${CH3_WORDS.length}`);
  }
  if (f.has("ch5") && !f.has("ch5_pots")) {
    const n = countKnown(g, COLORS);
    if (n >= 5) { f.add("ch5_pots"); g.goal("Все пять красок ожили. Поговори с Лотте."); }
    else g.goal(`Потрогай краски у дома Лотте: ${n} из 5`);
  }
}
function checkTriggers(g) {
  const p = g.player, f = g.flags, wd = g.world;
  const tx = Math.floor(p.x / TILE), ty = Math.floor((p.y - 4) / TILE);
  if (f.has("oma_bread") && !f.has("ch1_done")) {
    const o = ent(g, "oma");
    if (Math.hypot(o.x - p.x, o.y - p.y) > 5 * TILE) { g.run(omaTschuess(g)); return; }
  }
  if (f.has("ch4")) for (let i = 1; i < 6; i++) {
    const s = ent(g, "sheep" + i);
    if (s.follow && s.x > PEN[0] && s.x < PEN[0] + PEN[2] && s.y > PEN[1] && s.y < PEN[1] + PEN[3]) { g.run(sheepHome(g, i)); return; }
  }
  if (f.has("ch6_done") && ty < 65 && !f.has("ch7")) { g.run(ch7Intro(g)); return; }
  if (f.has("ch7") && ty <= 56 && !f.has("ch7_feel")) { g.run(ch7Feel(g)); return; }
  if (p.size === "small" && ((f.has("small_from_s") && ty <= 48) || (f.has("small_from_n") && ty >= 52))) { g.run(sizeBack(g, "Гриб больше не действует. Ты снова обычного роста, и трава снова просто трава.")); return; }
  if (p.size === "big" && ty <= 45) { g.run(sizeBack(g, "Сила уходит. Ты снова обычного роста.")); return; }
  if (wd.tileAt(tx, ty) === "d" && !f.has("dunkel_done")) { g.run(caveDark(g)); return; }
  if (ty <= 40 && wd.tileAt(tx, ty) === "d" && !g.lantern) { g.run(caveBlock(g)); return; }
  if (ty <= 37 && !f.has("ch7_done") && f.has("dunkel_done")) { g.run(ch8Intro(g)); return; }
  for (const k of SHADOW_ORDER) {
    const s = ent(g, k);
    if (s.shadow && s.visible && Math.hypot(s.x - p.x, s.y - p.y) < 70) { g.run(shadowFight(g, k)); return; }
  }
  if (f.has("ch8_done") && ty <= 18 && !f.has("ch9")) { g.run(ch9Bridge(g)); return; }
  if (f.has("ch9_jump") && ty <= 10 && !f.has("ch10")) { g.run(ch10Tower(g)); return; }
}
function onBump(g, tiles) {
  const f = g.flags, p = g.player, has = t => tiles.has(t), anyRow = r => [...tiles].some(t => +t.split(",")[1] === r);
  if ((has("30,66") || has("31,66") || has("32,66")) && !f.has("gate_open")) {

  }
  if (anyRow(58) && g.abilities.has("springen")) { g.toast(g.touch ? "Встань у воды и жми «прыжок»!" : "ПРОБЕЛ — spring!"); g.bumpCool = 2.5; return null; }
  if (has("14,50") && p.size !== "small") return sayOnce(g, "think", "Внизу в изгороди есть дыра, но в неё разве что мышь пролезет. Мне бы стать поменьше…");
  if (anyRow(50)) return sayOnce(g, "think", "Изгородь сплошная и колючая, не перелезешь и не перепрыгнешь. Остаётся только та дыра внизу.");

  if ([...tiles].some(t => +t.split(",")[1] === 11) && f.has("ch9_jump")) { g.toast(g.touch ? "Ты на краю моста, жми «прыжок»!" : "Ты на краю моста, жми ПРОБЕЛ!"); g.bumpCool = 2.5; }
  return null;
}

// ------------------------------------------------------------------ prologue + chapter 1
function* prologue(g) {

  yield new Title("Глава 1", "Hallo", "Привет");
  g.goal("", "Глава 1 · Hallo");
  const oma = ent(g, "oma");

  yield g.say("oma", "<Hallo!>");

  yield g.say("oma", "<Hallo?>");
  let r = yield g.choice("oma", "Старушка ждёт ответа и прикладывает ладонь к уху.", ["<Hallo!>", "…промолчать"], 0);

    yield g.say("oma", "<Hal-lo?..>");
    r = yield g.choice("oma", "Ну же, скажи хоть словечко.", ["<Hallo!>", "…промолчать"], 0);
  }
  g.use("hallo"); g.color("oma"); g.audio.play("chime");
  yield g.narr("Ты отвечаешь, и старушка на глазах наливается цветом: красный платок, сиреневое платье, белый фартук.");

  yield g.say("oma", "Я Ома Грета. «Ома» по-нашему значит «бабушка», вот меня все так и зовут.");
  yield g.say("oma", "Вчера ночью через деревню прошёл Немой Маг. Прошёл молча и унёс с собой все слова, до последнего.");
  yield g.say("oma", "А вещь, у которой нет имени, выцветает. Сам видишь: дома серые, деревья серые. И люди уже забывают, кто они такие.");
  yield g.say("oma", "Тебя я утром у колодца нашла. Ты, видать, тоже всё позабыл, бедняга.");
  const bello = ent(g, "bello");
  bello.wander = 0; g.audio.play("woof");

  yield g.say("oma", "А вот и Белло, наш пёс. Тоже весь посерел, бедолага.");

  yield g.say("oma", "<Brot?>");
  g.audio.play("woof"); g.emote(bello, "heart");
  yield g.narr("Белло подпрыгивает и виляет хвостом изо всех сил. Ома кивает за него.");
  yield g.say("oma", "<Ja! Ja!>");

  g.emote(bello, "…");
  yield g.narr("Белло фыркает и отворачивается. Ома мотает головой.");

function* talkKids(g, e) {

function paint(g, c, quiet) {

  if (c === "rot") { for (const p of wd.props) if (p.name.startsWith("house")) p.forceColor = true; }
  else if (c === "gruen") { for (const p of wd.props) if (p.ty >= 66 && /^(tree|pine|bush|appletree)/.test(String(p.img))) p.forceColor = true; }
  else if (c === "gelb") { for (const p of wd.props) if (p.ty >= 66 && (p.name.startsWith("fl") || p.name === "flower")) p.forceColor = true; }
  else if (c === "weiss") {
    for (const p of wd.props) if (/^(fence|pen_|gate|hay|deco|table|well|bucket)/.test(p.name)) p.forceColor = true;
    for (let i = 0; i < 6; i++) g.flags.add("col:sheep" + i);
  } else if (c === "blau") { wd.colored.village = true; g.flags.add("zone:village"); }
  if (!quiet) { const p = g.player; for (let i = 0; i < 4; i++) g.sparkle(p.x + uniform(-300, 300), p.y + uniform(-200, 150), 20); }
  g.portraitCache = {};
}

function* shadowFight(g, k) {

  } else yield g.narr(k === "baer" ? "Ещё одна тень. Огромная." : "Ещё одна тень загораживает тропинку.");
  if (k === "baer") { g.shake = 0.6; g.audio.play("growl"); }
  yield new ShadowBattle(d.sprite, k, d.options, d.hints);
  freeShadow(g, k);

}

  else if (k === "eule") { if (quiet) place(s, 33, 17); }
  else if (k === "baer") { if (quiet) place(s, 35, 18); s.solid = true; }
  s.talk = talkShadow;
  if (SHADOW_ORDER.every(x => g.flags.has("named_" + x))) { g.flags.add("ch8_done"); g.world.colored.forest = true; g.flags.add("zone:forest"); }

    const r = yield g.choice("hero", "Что сказать?", ["<Hallo, Hase!>", "<Tschüss, Hase!>"], 0);

function* runAway(g, s, dirx, fly) {

}

}

class Ending extends Action {
  start(g) { super.start(g); g.audio.play("chime"); }
  handle(ev) { if (isConfirm(ev) && this.t > 2) this.done = true; }
  update(dt) { this.t += dt; if (this.g.auto) this.done = true; }
  draw(ctx) {
    const g = this.g;
    dim(ctx, Math.min(225, this.t * 160));
    if (this.t < 0.4) return;
    drawText(ctx, "Ende", WIDTH / 2, 150, 110, DE, { center: true, bold: true });
    const lines = [`Слов в книге: ${Object.keys(g.known).length} из ${ORDER.length}`, `Ты провёл в пути ${Math.floor(g.playTime / 60)} мин.`, "",
      "Язык не обязательно зубрить. В нём можно просто пожить.", "", "Danke fürs Spielen! Спасибо, что поиграл!"];
    let y = 250;
    for (const ln of lines) { if (ln) drawText(ctx, ln, WIDTH / 2, y, 32, WHITE, { center: true }); y += 42; }
    if (this.t > 2 && Math.floor(this.t * 2.5) % 2 === 0) drawText(ctx, g.touch ? "нажми, чтобы гулять дальше" : "E — гулять дальше", WIDTH / 2, 590, 26, MUTED, { center: true });
  }
}

// ============================================================================
// main: page setup - sharp canvas on any screen, keyboard + touch input,
// name entry field, "rotate your phone" hint, fullscreen, the game loop.
// ============================================================================
(function () {
  const canvas = document.getElementById("game");
  const params = new URLSearchParams(location.search);
  const game = new Game(canvas, { auto: params.has("auto") });
  window.WW = game;
  let scale = 1, dpr = 1;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    // phones in landscape are wider than 3:2 - show more of the world instead of black bars
    const wide = Math.round(Math.max(960, Math.min(1440, HEIGHT * vw / vh)));
    if (wide !== WIDTH) { WIDTH = wide; game.darkCanvas = makeCanvas(WIDTH, HEIGHT); }
    scale = Math.min(vw / WIDTH, vh / HEIGHT);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = Math.floor(WIDTH * scale) + "px";
    canvas.style.height = Math.floor(HEIGHT * scale) + "px";
    canvas.width = Math.floor(WIDTH * scale * dpr);
    canvas.height = Math.floor(HEIGHT * scale * dpr);
    game.ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    game.ctx.imageSmoothingEnabled = false;
    const rot = document.getElementById("rotate");
    rot.style.display = (game.touch || "ontouchstart" in window) && vh > vw * 1.1 && !rot.dismissed ? "flex" : "none";
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));
  document.getElementById("rotate-ok").addEventListener("click", () => { document.getElementById("rotate").dismissed = true; resize(); });

  // ---- keyboard
  const KEYMAP = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down",
    A: "left", D: "right", W: "up", S: "down", " ": "space", Enter: "enter", e: "e", E: "e", Shift: "shift", Backspace: "back", Delete: "back",
    Tab: "tab", Escape: "esc", r: "r", R: "r", m: "m", M: "m", v: "v", V: "v",
    "ф": "left", "в": "right", "ц": "up", "ы": "down", "у": "e", "к": "r", "ь": "m", "м": "v" };
  window.addEventListener("keydown", e => {
    if (e.target && e.target.tagName === "INPUT") return;
    let k = KEYMAP[e.key];
    if (!k && /^[1-9]$/.test(e.key)) k = e.key;
    if (!k) return;
    e.preventDefault();
    if (e.repeat && !["left", "right", "up", "down", "shift"].includes(k)) return;
    if (e.repeat) return;
    game.keyEvent(k, true);
  });
  window.addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) game.keyEvent(k, false); });
  window.addEventListener("blur", () => { game.keys.clear(); game.joy = null; game.runHeld = false; });

  // ---- pointer (mouse + touch, multi-touch)
  function pos(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * WIDTH, (e.clientY - r.top) / r.height * HEIGHT]; }
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
    const [x, y] = pos(e);
    const wasTouch = game.touch;
    game.pointerDown(e.pointerId, x, y, e.pointerType === "touch" || e.pointerType === "pen");
    if (!wasTouch && game.touch) resize();
  });
  canvas.addEventListener("pointermove", e => { const [x, y] = pos(e); game.pointerMove(e.pointerId, x, y); });
  const up = e => game.pointerUp(e.pointerId);
  canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  if ("ontouchstart" in window) game.touch = true;

  // ---- name entry with the phone's keyboard
  const ask = document.getElementById("ask"), askInput = document.getElementById("ask-input");
  game.onAskText = (title, def, cb) => {
    document.getElementById("ask-title").textContent = title;
    askInput.value = ""; askInput.placeholder = def;
    ask.style.display = "flex";
    setTimeout(() => askInput.focus(), 50);
    const done = () => { ask.style.display = "none"; askInput.blur(); cb(askInput.value || def); };
    document.getElementById("ask-ok").onclick = done;
    askInput.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); done(); } };
  };

  // ---- fullscreen (and landscape lock where the browser allows it)
  game.onFullscreen = () => {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) Promise.resolve(req.call(el)).then(() => { try { screen.orientation.lock("landscape").catch(() => { }); } catch (_) { } }).catch(() => { });
  };

  // ---- loop
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    game.update(dt);
    game.draw();
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
  document.getElementById("loading").style.display = "none";
})();

</script>
</body>
</html>
